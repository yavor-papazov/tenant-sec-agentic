  m3.subcontracting:
    - https://framework.stackit.cloud/architecture/pillars/sovereignty/sov-06-jurisdictional-chain/
  m3.continuity:
    - https://framework.stackit.cloud/adoption/adapting-operating-models/disaster-recovery/
  m3.transfers:
    - https://docs.stackit.cloud/platform/regions/
  m3.vulnerability_disclosure:
    - https://docs.stackit.cloud/platform/security-bulletin/
  m3.certifications:
    - https://docs.stackit.cloud/platform/regions/
  compute.serverless-security:
    - https://framework.stackit.cloud/architecture/assetcontainer/stackit/stackit-service-functions/
  data.classification:
    - https://framework.stackit.cloud/architecture/pillars/security/sec-03-data-classification/
  data.residency-guarantees:
    - https://docs.stackit.cloud/platform/regions/
    - https://docs.stackit.cloud/products/storage/object-storage/basics/architecture/
  enc.cmk:
    - https://docs.stackit.cloud/products/security/kms/
    - https://docs.stackit.cloud/products/security/secrets-manager/how-tos/kms-encryption-in-the-secrets-manager/
  enc.confidential-computing:
    - https://docs.stackit.cloud/products/compute-engine/server/basics/machine-types/
    - https://www.stackit.de/de/agb/leistungsscheine/stackit-confidential-server/
  enc.external-key-management:
    - https://docs.stackit.cloud/products/security/kms/
  enc.hsm-backing:
    - https://docs.stackit.cloud/products/security/kms/how-tos/create-and-manage-keys/
  incident.resilience-testing:
    - https://framework.stackit.cloud/architecture/pillars/reliability/rel-10-health-model-and-testing/
  log.control-plane-audit:
    - https://docs.stackit.cloud/platform/audit-log/
    - https://docs.stackit.cloud/products/logging-and-monitoring/telemetry-router/basics/dataformats/
  log.resource-inventory:
    - https://docs.stackit.cloud/platform/resource-manager/basics/
    - https://docs.stackit.cloud/products/security/cspm/basics/concepts/
    - https://docs.stackit.cloud/platform/audit-log/
  net.flow-logging:
    - https://docs.stackit.cloud/products/network/core-networking/basics/architecture/
    - https://docs.stackit.cloud/products/runtime/kubernetes-engine/basics/networking/container/
  net.private-connectivity:
    - https://docs.stackit.cloud/products/network/core-networking/network-area/basics/concepts/
    - https://docs.stackit.cloud/products/network/connectivity-hybrid-multi-cloud/vpn/basics/
    - https://docs.stackit.cloud/products/storage/object-storage/basics/architecture/
    - https://docs.stackit.cloud/products/runtime/kubernetes-engine/how-tos/use-postgresql-and-mongodb-flex-with-ske/

models:
  doc_fetch: vertex_ai/gemini-2.5-flash
  assessor: vertex_ai/gemini-2.5-flash
  skeptic: vertex_ai/gemini-2.5-flash
  consistency: vertex_ai/gemini-2.5-flash
  deep_research: vertex_ai/gemini-2.5-flash

vertex_traffic_class: standard

pricing:
  vertex_ai/gemini-2.5-flash:
    input_per_million: 0.54
    output_per_million: 4.50

limits:
  max_model_calls_per_run: 50
  max_input_tokens_per_run: 750000
  max_output_tokens_per_run: 150000
  max_output_tokens_per_call: 24576
  model_timeout_seconds: 300
  max_model_turns_per_agent: 12
  max_retries_per_run: 10
  max_retries_per_call: 2
  max_search_calls_per_run: 30
  max_fetch_calls_per_run: 30
  max_search_calls_per_doc_fetch: 2
  max_fetch_calls_per_doc_fetch: 3
  max_deep_research_per_run: 5
  max_search_calls_per_deep_research: 3
  max_fetch_calls_per_deep_research: 2
  max_projected_cost_usd: 4.0
  max_parallel_assessments: 3

paths:
  repo_root: ../tenant-sec
  assessments_dir: ./assessments
  reports_dir: ./reports

session:
  database_path: ./pipeline_sessions.stackit.db
  resume_existing: false
  resume_artifacts: true

mock_mode: false
