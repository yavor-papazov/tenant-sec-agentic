provider:
  slug: hetzner
  display_name: Hetzner Cloud
  docs_base_url: https://docs.hetzner.com
  assessment_id: hetzner/cloud/eu-central/standard
  offering:
    id: cloud
    name: Hetzner Cloud
    partition: commercial
    regions: [fsn1, nbg1, hel1]
    region_equivalence: >-
      The assessed Cloud and Object Storage product surface is available across
      Hetzner's EU-central locations; location-specific limitations remain part
      of claim applicability and human review.
    edition: standard
    cohort: cost-focused
  services_in_scope:
    - { id: cloud-servers, name: Cloud Servers, category: compute.vm, regions: [fsn1, nbg1, hel1], edition: standard }
    - { id: object-storage, name: Object Storage, category: storage.object, regions: [fsn1, nbg1, hel1], edition: standard }
    - { id: volumes, name: Volumes, category: storage.block, regions: [fsn1, nbg1, hel1], edition: standard }
    - { id: networks, name: Networks, category: network.vpc, regions: [fsn1, nbg1, hel1], edition: standard }
    - { id: load-balancers, name: Load Balancers, category: network.loadbalancer, regions: [fsn1, nbg1, hel1], edition: standard }
    - { id: dns, name: DNS, category: network.dns, regions: [fsn1, nbg1, hel1], edition: standard }
    - { id: project-access, name: Project Access, category: identity.iam, regions: [fsn1, nbg1, hel1], edition: standard }

controls:
  scope: all

models:
  doc_fetch: vertex_ai/gemini-3.5-flash
  assessor: vertex_ai/gemini-3.5-flash
  skeptic: vertex_ai/gemini-3.5-flash
  consistency: vertex_ai/gemini-3.5-flash
  deep_research: vertex_ai/gemini-3.5-flash

vertex_traffic_class: priority

pricing:
  vertex_ai/gemini-3.5-flash:
    input_per_million: 2.70
    output_per_million: 16.20

limits:
  max_model_calls_per_run: 50
  max_input_tokens_per_run: 750000
  max_output_tokens_per_run: 150000
  max_output_tokens_per_call: 12288
  model_timeout_seconds: 300
  max_model_turns_per_agent: 12
  max_retries_per_run: 10
  max_retries_per_call: 2
  max_search_calls_per_run: 30
  max_fetch_calls_per_run: 30
  max_search_calls_per_doc_fetch: 2
  max_fetch_calls_per_doc_fetch: 3
  max_deep_research_per_run: 5
  max_search_calls_per_deep_research: 3
  max_fetch_calls_per_deep_research: 2
  max_projected_cost_usd: 4.0
  max_parallel_assessments: 1

paths:
  repo_root: ../tenant-sec
  assessments_dir: ./assessments
  reports_dir: ./reports

session:
  database_path: ./pipeline_sessions.hetzner.db
  resume_existing: false
  resume_artifacts: true

mock_mode: false
