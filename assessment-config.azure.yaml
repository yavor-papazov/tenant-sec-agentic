provider:
  slug: azure
  display_name: Microsoft Azure
  docs_base_url: https://learn.microsoft.com/azure
  assessment_id: azure/public/westeurope/standard
  offering:
    id: public
    name: Microsoft Azure Public Cloud
    partition: commercial
    regions: [westeurope]
    edition: standard
    cohort: hyperscaler
  services_in_scope:
    - { id: virtual-machines, name: Azure Virtual Machines, category: compute.vm, regions: [westeurope], edition: standard }
    - { id: aks, name: Azure Kubernetes Service, category: compute.containers, regions: [westeurope], edition: standard }
    - { id: functions, name: Azure Functions, category: compute.serverless, regions: [westeurope], edition: standard }
    - { id: blob-storage, name: Azure Blob Storage, category: storage.object, regions: [westeurope], edition: standard }
    - { id: managed-disks, name: Azure Managed Disks, category: storage.block, regions: [westeurope], edition: standard }
    - { id: sql-database, name: Azure SQL Database, category: database.relational, regions: [westeurope], edition: standard }
    - { id: cosmos-db, name: Azure Cosmos DB, category: database.nosql, regions: [westeurope], edition: standard }
    - { id: virtual-network, name: Azure Virtual Network, category: network.vpc, regions: [westeurope], edition: standard }
    - { id: load-balancer, name: Azure Load Balancer, category: network.loadbalancer, regions: [westeurope], edition: standard }
    - { id: application-gateway, name: Azure Application Gateway, category: network.loadbalancer, regions: [westeurope], edition: standard }
    - { id: dns, name: Azure DNS, category: network.dns, regions: [westeurope], edition: standard }
    - { id: private-dns, name: Azure Private DNS, category: network.dns, regions: [westeurope], edition: standard }
    - { id: key-vault, name: Azure Key Vault, category: security.kms, regions: [westeurope], edition: standard }
    - { id: web-application-firewall, name: Azure Web Application Firewall, category: security.waf, regions: [westeurope], edition: standard }
    - { id: entra-id, name: Microsoft Entra ID, category: identity.iam, regions: [westeurope], edition: standard }

controls:
  scope: all

models:
  doc_fetch: vertex_ai/gemini-2.5-flash
  assessor: vertex_ai/gemini-2.5-flash
  skeptic: vertex_ai/gemini-2.5-flash
  consistency: vertex_ai/gemini-2.5-flash
  deep_research: vertex_ai/gemini-2.5-flash

vertex_traffic_class: standard

pricing:
  vertex_ai/gemini-2.5-flash:
    input_per_million: 0.54
    output_per_million: 4.50

limits:
  max_model_calls_per_run: 50
  max_input_tokens_per_run: 750000
  max_output_tokens_per_run: 150000
  max_output_tokens_per_call: 12288
  model_timeout_seconds: 300
  max_model_turns_per_agent: 12
  max_retries_per_run: 10
  max_retries_per_call: 2
  max_search_calls_per_run: 30
  max_fetch_calls_per_run: 30
  max_search_calls_per_doc_fetch: 2
  max_fetch_calls_per_doc_fetch: 3
  max_deep_research_per_run: 5
  max_search_calls_per_deep_research: 3
  max_fetch_calls_per_deep_research: 2
  max_projected_cost_usd: 4.0
  max_parallel_assessments: 1

paths:
  repo_root: ../tenant-sec
  assessments_dir: ./assessments
  reports_dir: ./reports

session:
  database_path: ./pipeline_sessions.azure.db
  resume_existing: false
  resume_artifacts: true

mock_mode: false
