[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tenant-sec-agentic"
version = "0.1.0"
description = "Agentic assessment pipeline for tenant-sec provider profiles"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "google-adk>=1.32,<2",
  "litellm>=1.75",
  "pyyaml>=6.0",
  "jsonschema>=4.20",
  "httpx>=0.27",
  "trafilatura>=2.0",
  "click>=8.1",
  "python-dotenv>=1.0",
  "greenlet>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tenant-sec-pipeline = "tenant_sec_agentic.cli:main"
tenant-sec-aggregate = "tenant_sec_agentic.aggregate_cli:main"
tenant-sec-batch = "tenant_sec_agentic.batch_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tenant_sec_agentic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
